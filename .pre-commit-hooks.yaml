- id: fix-databricks-magic
  name: Lint and fix Databricks notebooks
  entry: fix-databricks-magic
  language: python
  types: [python]
  description: >
    Lints Databricks .py-format notebooks: prefixes bare magic commands with
    # MAGIC, strips leading blank lines, removes empty cells. Pass --fix to
    rewrite files. Use --select/--ignore to control which rules run.
